<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#eef1f0;
  --surface:#ffffff;
  --surface-2:#e3e8e6;
  --border:#d7ddda;
  --text:#161a19;
  --text-dim:#5c6763;
  --accent:#1f8a7a;
  --accent-ink:#ffffff;
  --danger:#c2453f;

  --c-circuit:#3d8fc4;
  --c-muscu:#e0863a;
  --c-boxe:#d1414f;
  --c-bag:#b45bd0;
  --c-running:#4a9b5e;
  --c-divers:#7a8a99;
  --c-gainage:#7b74d8;

  --a-leger:#e3b3ac;
  --a-modere:#c8695a;
  --a-arrose:#7c2c37;

  --injury:#b2492c;

  --heat-0: var(--surface-2);
  --heat-1: color-mix(in srgb, var(--accent) 35%, var(--surface));
  --heat-2: color-mix(in srgb, var(--accent) 65%, var(--surface));
  --heat-3: var(--accent);

  --font-display:'Manrope', system-ui, sans-serif;
  --font-body:'Work Sans', system-ui, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, monospace;

  --radius:14px;
  --shadow: 0 1px 2px rgba(20,30,28,.06), 0 8px 24px -12px rgba(20,30,28,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#12161a; --surface:#191f23; --surface-2:#232b30; --border:#2b3439;
    --text:#eef2f0; --text-dim:#93a09b; --accent:#39c7ae; --accent-ink:#08211c; --danger:#e8746e;
    --c-circuit:#66b3e6; --c-muscu:#f0a35f; --c-boxe:#e8707c; --c-bag:#d386e8; --c-running:#72c98a; --c-divers:#9aacb8; --c-gainage:#a29bef;
    --a-leger:#e8c3bd; --a-modere:#d98a7a; --a-arrose:#c65a68;
    --injury:#e08a63;
    --heat-0: var(--surface-2);
    --heat-1: color-mix(in srgb, var(--accent) 30%, var(--surface));
    --heat-2: color-mix(in srgb, var(--accent) 60%, var(--surface));
    --heat-3: var(--accent);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#12161a; --surface:#191f23; --surface-2:#232b30; --border:#2b3439;
  --text:#eef2f0; --text-dim:#93a09b; --accent:#39c7ae; --accent-ink:#08211c; --danger:#e8746e;
  --c-circuit:#66b3e6; --c-muscu:#f0a35f; --c-boxe:#e8707c; --c-bag:#d386e8; --c-running:#72c98a; --c-divers:#9aacb8; --c-gainage:#a29bef;
  --a-leger:#e8c3bd; --a-modere:#d98a7a; --a-arrose:#c65a68;
  --injury:#e08a63;
  --heat-0: var(--surface-2);
  --heat-1: color-mix(in srgb, var(--accent) 30%, var(--surface));
  --heat-2: color-mix(in srgb, var(--accent) 60%, var(--surface));
  --heat-3: var(--accent);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}

*{box-sizing:border-box;}
body{ background:var(--bg); color:var(--text); font-family:var(--font-body); }
button{ font:inherit; cursor:pointer; color:inherit; }
input,textarea{ font:inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
@media (prefers-reduced-motion: reduce){ *{ transition:none!important; animation:none!important; } }

#app{ display:flex; flex-direction:column; min-height:100%; max-width:560px; margin:0 auto; }

#topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); padding:18px 20px 8px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
#topbar h1{ font-family:var(--font-display); font-size:20px; font-weight:800; letter-spacing:-.01em; margin:0; }
.streak-pill{ font-family:var(--font-mono); font-size:11.5px; font-weight:600; color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--surface)); padding:4px 10px; border-radius:999px; white-space:nowrap; }
.topbar-right{ display:flex; align-items:center; gap:8px; }
.refresh-btn{ width:30px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--text-dim); font-size:15px; flex:0 0 auto; }
.refresh-btn.spinning{ animation:spin .7s linear; }

#content{ flex:1; padding:6px 16px 100px; display:flex; flex-direction:column; gap:16px; }

#tabbar{ position:fixed; left:0; right:0; bottom:0; display:flex; overflow-x:auto; justify-content:flex-start; background:var(--surface); border-top:1px solid var(--border); padding:7px 4px calc(7px + env(safe-area-inset-bottom,0px)); max-width:560px; margin:0 auto; z-index:6; }
#tabbar button{ flex:0 0 auto; min-width:58px; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; color:var(--text-dim); font-size:10.5px; font-weight:500; padding:4px 6px; border-radius:10px; }

.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:12px; }
.card-head{ display:flex; align-items:center; justify-content:space-between; }
.card h2{ font-family:var(--font-display); font-size:15px; font-weight:700; margin:0; }
.btn-add{ font-size:12.5px; font-weight:700; color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--surface)); border:none; padding:7px 13px; border-radius:999px; }

.session-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.session-item{ display:flex; align-items:center; gap:10px; }

.icon-btn{ background:none; border:none; color:var(--text-dim); font-size:13px; padding:5px; line-height:1; }

.cat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.cat-chip{ border:1.5px solid var(--border); background:var(--surface); border-radius:10px; padding:10px 6px; font-size:12px; font-weight:600; color:var(--text); }
.cat-chip.active{ border-color:var(--chip); background:color-mix(in srgb, var(--chip) 16%, var(--surface)); color:var(--chip); }
textarea{ width:100%; min-height:58px; border:1.5px solid var(--border); border-radius:10px; padding:10px; font-size:13.5px; background:var(--surface); color:var(--text); resize:vertical; }
textarea::placeholder{ color:var(--text-dim); }
input[type=text]{ width:100%; border:1.5px solid var(--border); border-radius:10px; padding:10px; font-size:13.5px; background:var(--surface); color:var(--text); }
input[type=text]::placeholder{ color:var(--text-dim); }
.form-actions{ display:flex; gap:10px; justify-content:flex-end; }
.btn-primary{ background:var(--accent); color:var(--accent-ink); border:none; padding:10px 16px; border-radius:10px; font-weight:700; font-size:13.5px; }
.btn-primary:disabled{ opacity:.4; }
.btn-secondary{ background:none; border:1.5px solid var(--border); color:var(--text-dim); padding:10px 16px; border-radius:10px; font-weight:600; font-size:13.5px; }
.btn-block{ width:100%; }

.gainage-toggle{ border:1.5px solid var(--border); background:var(--surface); color:var(--text); border-radius:12px; padding:13px; font-weight:700; font-size:13.5px; width:100%; text-align:center; }
.gainage-toggle.active{ border-color:var(--c-gainage); background:color-mix(in srgb, var(--c-gainage) 18%, var(--surface)); color:var(--c-gainage); }

.alcohol-picker{ display:flex; gap:8px; flex-wrap:wrap; }
.alc-chip{ border:1.5px solid var(--border); background:var(--surface); border-radius:10px; padding:9px 12px; font-size:12.5px; font-weight:600; color:var(--text); }
.alc-chip.active{ border-color:var(--chip); background:color-mix(in srgb, var(--chip) 22%, var(--surface)); color:var(--chip); }
.link-btn{ align-self:flex-start; background:none; border:none; color:var(--text-dim); font-size:12px; text-decoration:underline; padding:0; }

.day-nav{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:2px 2px 4px; }
.nav-btn{ width:36px; height:36px; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:18px; flex:none; }
.day-label{ display:flex; flex-direction:column; align-items:center; gap:3px; }
.day-date{ font-family:var(--font-display); font-weight:700; font-size:15.5px; text-align:center; text-transform:capitalize; }
.badge-today{ font-size:10.5px; color:var(--accent); font-weight:700; text-transform:uppercase; letter-spacing:.04em; background:none; border:none; }

.week-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.week-cell{ background:var(--surface); border:1px solid var(--border); border-radius:12px; min-height:66px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:6px 2px; position:relative; }
.week-cell.today{ border-color:var(--accent); }
.week-cell-dow{ font-size:9.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.03em; }
.week-cell-num{ font-family:var(--font-mono); font-weight:600; font-size:14px; font-variant-numeric:tabular-nums; }
.week-dots{ display:flex; gap:2px; flex-wrap:wrap; justify-content:center; max-width:34px; min-height:6px; }
.week-dots i{ width:5px; height:5px; border-radius:50%; }
.week-alc{ position:absolute; bottom:4px; width:14px; height:3px; border-radius:2px; }

.month-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:10.5px; color:var(--text-dim); margin-bottom:2px; }
.month-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.month-cell{ background:var(--surface); border:1px solid var(--border); border-radius:9px; min-height:48px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:4px 2px; position:relative; }
.month-cell.active{ background:color-mix(in srgb, var(--accent) 7%, var(--surface)); }
.month-cell.injured{ box-shadow:inset 0 0 0 1.5px var(--injury); }
.month-cell.dim{ opacity:.35; }
.month-cell.today{ border-color:var(--accent); }
.month-num{ font-family:var(--font-mono); font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums; }
.month-dots{ display:flex; gap:2px; align-items:center; min-height:5px; }
.month-dots i{ width:4.5px; height:4.5px; border-radius:50%; }
.month-dots i.more{ width:auto; height:auto; border-radius:0; font-size:8px; color:var(--text-dim); background:none!important; }
.month-alc{ position:absolute; bottom:3px; width:10px; height:2.5px; border-radius:2px; }
.month-gainage{ position:absolute; top:3px; right:3px; width:6px; height:6px; border-radius:50%; background:var(--c-gainage); }

.year-scroll{ overflow-x:auto; padding-bottom:4px; }
.year-months{ display:grid; grid-auto-flow:column; grid-auto-columns:10px; gap:3px; font-size:9.5px; color:var(--text-dim); margin-bottom:4px; white-space:nowrap; }
.year-heatmap{ display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,10px); grid-auto-columns:10px; gap:3px; }
.year-cell{ width:10px; height:10px; border-radius:2px; border:none; padding:0; position:relative; }
.year-cell.empty-cell{ visibility:hidden; }
.year-cell.today{ outline:1.5px solid var(--text); outline-offset:1px; }
.year-cell.injured{ box-shadow:inset 0 0 0 1.5px var(--injury); }
.year-alc{ position:absolute; bottom:-2px; right:-2px; width:5px; height:5px; border-radius:50%; box-shadow:0 0 0 1px var(--surface); }
.year-legend{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--text-dim); margin-top:6px; flex-wrap:wrap; }
.year-legend i{ width:10px; height:10px; border-radius:2px; display:inline-block; }
.legend-alc{ display:flex; align-items:center; gap:4px; margin-left:10px; }
.legend-alc i{ border-radius:50%; background:var(--a-arrose); }
.legend-injury{ display:flex; align-items:center; gap:4px; }
.legend-injury i{ border-radius:2px; background:none; box-shadow:inset 0 0 0 1.5px var(--injury); }
.gainage-heatmap{ display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,10px); grid-auto-columns:10px; gap:3px; }

.card-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.card-row .card{ padding:12px; gap:8px; }
.card-row .card h2{ font-size:13px; }

.tiles{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.tile{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; display:flex; flex-direction:column; gap:2px; box-shadow:var(--shadow); }
.tile-num{ font-family:var(--font-mono); font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; }
.tile-label{ font-size:11.5px; color:var(--text-dim); }

.bar-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
.bar-row{ display:grid; grid-template-columns:96px 1fr 24px; align-items:center; gap:8px; }
.bar-label{ font-size:12px; color:var(--text-dim); }
.bar-track{ height:8px; background:var(--surface-2); border-radius:6px; overflow:hidden; }
.bar-fill{ height:100%; border-radius:6px; }
.bar-count{ font-family:var(--font-mono); font-size:12px; text-align:right; font-variant-numeric:tabular-nums; }

.filter-row{ display:flex; gap:10px; flex-wrap:wrap; }
.filter-row label{ display:flex; flex-direction:column; gap:3px; font-size:11px; color:var(--text-dim); flex:1; min-width:130px; }
.filter-row input[type=date]{ border:1.5px solid var(--border); border-radius:8px; padding:7px 8px; background:var(--surface); color:var(--text); font-family:var(--font-mono); font-size:12.5px; }
.filter-presets{ display:flex; gap:6px; flex-wrap:wrap; }
.filter-presets button{ border:1.5px solid var(--border); background:var(--surface); color:var(--text-dim); border-radius:999px; padding:5px 12px; font-size:12px; font-weight:600; }
.filter-presets button.active{ border-color:var(--accent); color:var(--accent); }
.stat-line{ font-size:13px; color:var(--text-dim); margin:0; }
.delta{ font-size:11px; color:var(--text-dim); margin-left:6px; }

.cat-tabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; }
.cat-tab{ flex:none; border:1.5px solid var(--border); background:var(--surface); color:var(--text-dim); border-radius:999px; padding:7px 13px; font-size:12.5px; font-weight:600; white-space:nowrap; }
.cat-tab.active{ border-color:var(--chip); background:color-mix(in srgb, var(--chip) 18%, var(--surface)); color:var(--chip); }
.history-summary{ font-size:12px; color:var(--text-dim); display:flex; align-items:center; gap:6px; }
.history-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
.history-item{ padding:11px 0; border-bottom:1px solid var(--border); }
.history-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.history-main{ flex:1; min-width:0; }
.history-actions{ display:flex; gap:2px; flex:none; }
.edit-row{ list-style:none; }
.history-item:last-child{ border-bottom:none; }
.history-date{ font-family:var(--font-mono); font-weight:600; font-size:12.5px; text-transform:capitalize; }
.history-note{ font-size:13px; margin-top:2px; }
.history-note.dim{ color:var(--text-dim); font-style:italic; }

.injury-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
.injury-item{ padding:12px 0; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.injury-item:last-child{ border-bottom:none; }
.injury-main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
.injury-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.injury-zone{ font-weight:700; font-size:14px; }
.badge-ongoing{ font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--injury); background:color-mix(in srgb, var(--injury) 16%, var(--surface)); padding:2px 8px; border-radius:999px; }
.injury-range{ font-size:12.5px; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.injury-duration{ font-family:var(--font-mono); }
.injury-note{ font-size:13px; }
.injury-bar{ height:5px; background:var(--surface-2); border-radius:4px; overflow:hidden; max-width:220px; }
.injury-bar-fill{ height:100%; background:var(--injury); border-radius:4px; }
.day-injury-banner{ background:color-mix(in srgb, var(--injury) 10%, var(--surface)); border:1px solid color-mix(in srgb, var(--injury) 30%, var(--border)); border-radius:12px; padding:10px 12px; font-size:12.5px; display:flex; flex-direction:column; gap:2px; }
.day-injury-banner strong{ color:var(--injury); }

.banner{ background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim); border-radius:999px; padding:8px 14px; font-size:12px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.banner-retry{ background:none; border:none; color:var(--accent); font-weight:700; font-size:12px; padding:2px 4px; flex:none; }

.toast{ position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,10px); background:var(--text); color:var(--bg); padding:9px 16px; border-radius:999px; font-size:12.5px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:20; max-width:80%; text-align:center; }
.toast.show{ opacity:1; transform:translate(-50%,0); }

.debug-panel{ position:fixed; left:0; right:0; bottom:0; max-height:65vh; overflow:auto; background:var(--card); color:var(--text); border-top:1px solid var(--border); z-index:30; transform:translateY(100%); transition:transform .2s; padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px)); box-shadow:0 -4px 16px rgba(0,0,0,.2); }
.debug-panel.open{ transform:translateY(0); }
.debug-panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:8px; }
.debug-panel-head strong{ font-size:13px; }
.debug-panel-actions{ display:flex; gap:6px; }
.debug-panel-actions button{ font-size:11px; padding:5px 9px; border-radius:7px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
.debug-log{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:10.5px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }

@media (max-width:380px){
  .cat-grid{ grid-template-columns:repeat(2,1fr); }
  .bar-row{ grid-template-columns:78px 1fr 22px; }
}
</style>

<script>
(function(){
  "use strict";
  // Switched from the Firestore client SDK (firebase-firestore-compat.js) to
  // calling Firestore's plain REST API directly with fetch(). The SDK's
  // real-time/streaming transport turned out to never actually leave the
  // browser in this environment: every read was silently served from its
  // local cache (confirmed via snap.metadata.fromCache===true on every
  // single read) while the real Firestore console showed the database
  // completely empty, no matter how long the app ran or how many writes
  // were made. Plain REST calls are ordinary HTTPS requests — no
  // persistent streaming connection, no offline-first local cache to be
  // silently served from — so a failure here surfaces as a real HTTP
  // error/status instead of a misleadingly "successful" local read.
  var FIRESTORE_BASE = 'https://firestore.googleapis.com/v1/projects/suivi-forme-75e08/databases/(default)/documents';
  function fsToFields(obj){
    var fields = {};
    Object.keys(obj).forEach(function(k){
      var v = obj[k];
      fields[k] = (v===null || v===undefined) ? {nullValue:null} : {stringValue:String(v)};
    });
    return fields;
  }
  function fsFromDoc(doc){
    var id = doc.name.split('/').pop();
    var data = {};
    var fields = doc.fields || {};
    Object.keys(fields).forEach(function(k){
      var f = fields[k];
      data[k] = (f.nullValue!==undefined) ? null : (f.stringValue!==undefined ? f.stringValue : null);
    });
    return Object.assign({id:id}, data);
  }
  async function fsGetCollection(collection){
    var res = await fetch(FIRESTORE_BASE+'/'+collection+'?pageSize=1000');
    if(!res.ok) throw new Error('GET '+collection+' -> HTTP '+res.status+': '+(await res.text()));
    var json = await res.json();
    return (json.documents||[]).map(fsFromDoc);
  }
  async function fsSetDoc(collection, id, data){
    var res = await fetch(FIRESTORE_BASE+'/'+collection+'/'+encodeURIComponent(id), {
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({fields: fsToFields(data)})
    });
    if(!res.ok) throw new Error('SET '+collection+'/'+id+' -> HTTP '+res.status+': '+(await res.text()));
  }
  async function fsUpdateDoc(collection, id, data){
    var mask = Object.keys(data).map(function(k){ return 'updateMask.fieldPaths='+encodeURIComponent(k); }).join('&');
    var res = await fetch(FIRESTORE_BASE+'/'+collection+'/'+encodeURIComponent(id)+'?'+mask, {
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({fields: fsToFields(data)})
    });
    if(!res.ok) throw new Error('UPDATE '+collection+'/'+id+' -> HTTP '+res.status+': '+(await res.text()));
  }
  async function fsDeleteDoc(collection, id){
    var res = await fetch(FIRESTORE_BASE+'/'+collection+'/'+encodeURIComponent(id), {method:'DELETE'});
    if(!res.ok) throw new Error('DELETE '+collection+'/'+id+' -> HTTP '+res.status+': '+(await res.text()));
  }

  // ---- persistence ----
  function loadLocalFallback(){

  // ---- offline write queue ----
  // Every cloud write goes through cloudWrite(). If the REST call fails for
  // any reason (offline, network error, server error), the operation is
  // queued to localStorage and retried the next time a sync happens — so
  // nothing logged offline is ever silently lost, on any device.
  function loadPendingOps(){
    try{
      var raw = localStorage.getItem(LS_PENDING_KEY);
      pendingOps = raw ? JSON.parse(raw) : [];
    }catch(e){ pendingOps = []; }
  }
  function savePendingOps(){
    try{ localStorage.setItem(LS_PENDING_KEY, JSON.stringify(pendingOps)); }catch(e){}
  }
  function queueOp(op){
    pendingOps.push(op);
    savePendingOps();
  }
  // Whether this item's *creation* is still sitting unsent in the local
  // queue. Only true while the original 'add' never reached the cloud —
  // once it is sent (even if we haven't seen the confirmation yet) or has
  // succeeded, the document exists for real and must be targeted with a
  // normal update/delete op, not patched out of the queue.
  function hasPendingAdd(collection, localId){
    return pendingOps.some(function(op){
      return op.type==='add' && op.collection===collection && op.localId===localId;
    });
  }
  function dropPendingAdd(collection, localId){
    pendingOps = pendingOps.filter(function(op){
      return !(op.type==='add' && op.collection===collection && op.localId===localId);
    });
    savePendingOps();
  }
  function updatePendingAdd(collection, localId, data){
    var found = false;
    pendingOps.forEach(function(op){
      if(op.type==='add' && op.collection===collection && op.localId===localId){
        op.data = Object.assign({}, op.data, data);
        found = true;
      }
    });
    if(found) savePendingOps();
    return found;
  }
  // Performs one op as a plain REST call. The id used to create a document
  // is always the locally-generated one (never a server auto-id), so the
  // local item and the cloud document always share the same id from the
  // very first write — an immediate edit/delete right after an add always
  // targets a document that actually exists.
  async function performOp(op){
    if(op.type==='add'){
      await fsSetDoc(op.collection, op.localId, op.data);
    } else if(op.type==='set'){
      await fsSetDoc(op.collection, op.docId, op.data);
    } else if(op.type==='update'){
      await fsUpdateDoc(op.collection, op.docId, op.data);
    } else if(op.type==='delete'){
      await fsDeleteDoc(op.collection, op.docId);
    }
  }
  function cloudWrite(op){
    var ref = op.docId || op.localId || '?';
    logEvent('cloudWrite: '+op.type+' '+op.collection+' id='+ref);
    performOp(op).then(function(){
      logEvent(op.type+' '+op.collection+' id='+ref+' -> OK (HTTP confirmé)');
      toast('Confirmé côté cloud');
    }).catch(function(e){
      console.error('cloudWrite failed', op, e);
      queueOp(op);
      logEvent(op.type+' '+op.collection+' id='+ref+' -> ÉCHEC: '+e.message);
      toast('Échec, mis en attente: '+e.message);
    });
  }
  async function flushPendingOps(){
    if(!pendingOps.length || pendingSyncing) return;
    pendingSyncing = true;
    var queue = pendingOps;
    pendingOps = [];
    var remaining = [];
    for(var i=0;i<queue.length;i++){
      try{
        await performOp(queue[i]);
      }catch(e){
        remaining.push(queue[i]);
      }
    }
    pendingOps = remaining.concat(pendingOps);
    savePendingOps();
    pendingSyncing = false;
  }

  function addSession(category, note, date){
    var entry = {date:date, category:category, note:note||'', createdAt:new Date().toISOString()};
    entry.id = 'local-'+Date.now()+'-'+Math.random().toString(36).slice(2);
    sessions.unshift(entry);
    saveLocalFallback();
    render();
    cloudWrite({type:'add', collection:'sessions', localId:entry.id, data:{date:entry.date, category:entry.category, note:entry.note, createdAt:entry.createdAt}});
  }
  function deleteSession(id){
    logEvent('deleteSession appelé, id='+id);
    sessions = sessions.filter(function(s){ return s.id!==id; });
    saveLocalFallback();
    render();
    if(hasPendingAdd('sessions', id)){
      logEvent('id='+id+' -> considéré comme ajout en attente, pas encore envoyé au cloud (dropPendingAdd)');
      dropPendingAdd('sessions', id);
    } else {
      cloudWrite({type:'delete', collection:'sessions', docId:id});
    }
  }
  function updateSession(id, category, note, date){
    var idx = -1;
    for(var i=0;i<sessions.length;i++){ if(sessions[i].id===id){ idx=i; break; } }
    if(idx===-1) return;
    sessions[idx] = Object.assign({}, sessions[idx], {category:category, note:note||'', date:date});
    saveLocalFallback();
    render();
    if(hasPendingAdd('sessions', id)){
      updatePendingAdd('sessions', id, {category:category, note:note||'', date:date});
    } else {
      cloudWrite({type:'update', collection:'sessions', docId:id, data:{category:category, note:note||'', date:date}});
    }
  }

  function updateInjury(id, zone, startDate, endDate, note){

    var payload = {zone:zone, startDate:startDate, note:note||'', endDate:endDate||null};

  function firstGainageDate(){
    if(!gainage.length) return null;
    return gainage.reduce(function(a,b){ return a.date<b.date?a:b; }).date;
  }
  function computeGainageStreak(){
    var count=0, cursor=new Date();
    if(!gainageOn(fmt(cursor))){ cursor = addDays(cursor,-1); }
    while(true){
      var ds = fmt(cursor);
      if(gainageOn(ds)){ count++; cursor = addDays(cursor,-1); }
      else break;
      if(count>3650) break;
    }
    return count;
  }
  function gainagePct(days){
    var from = fmt(addDays(new Date(), -(days-1)));
    var to = fmt(new Date());
    var start = firstGainageDate();
    // Don't count days before tracking began as "missed".
    var effectiveFrom = start && start > from ? start : from;
    var total = daysBetweenInclusive(effectiveFrom, to);
    if(total<=0) return null;
    var done = gainage.filter(function(g){ return g.date>=effectiveFrom && g.date<=to; }).length;
    return Math.round(done/total*100);
  }

  // ---- stats helpers ----
  function computeStreak(){
    var count=0, cursor=new Date();
    if(sessionsOn(fmt(cursor)).length===0){ cursor = addDays(cursor,-1); }
    while(true){
      var ds = fmt(cursor);
      if(sessionsOn(ds).length>0){ count++; cursor = addDays(cursor,-1); }
      else break;
      if(count>3650) break;
    }
    return count;
  }
  function firstTrackedDate(){
    var dates = sessions.map(function(s){ return s.date; }).concat(alcohol.map(function(a){ return a.date; }));
    if(!dates.length) return null;
    return dates.reduce(function(a,b){ return a<b?a:b; });
  }
  function computeNoAlcoholStreak(){
    var minDate = firstTrackedDate();
    if(!minDate) return 0;
    var count=0, cursor=new Date();
    while(true){
      var ds = fmt(cursor);
      if(ds < minDate) break;
      if(!alcoholOn(ds)){ count++; cursor = addDays(cursor,-1); }
      else break;
    }
    return count;
  }

  // ---- export ----
  function exportExcel(){
    if(typeof XLSX === 'undefined'){ toast('Export indisponible'); return; }
    var sportRows = [['Date','Catégorie','Note']].concat(
      sessions.slice().sort(function(a,b){ return a.date.localeCompare(b.date) || (a.createdAt||'').localeCompare(b.createdAt||''); })
        .map(function(s){ return [s.date, (CAT_MAP[s.category]||{}).label || s.category, s.note||'']; })
    );
    var alcoholRows = [['Date','Niveau']].concat(
      alcohol.slice().sort(function(a,b){ return a.date.localeCompare(b.date); })
        .map(function(a){ return [a.date, (ALC_MAP[a.level]||{}).label || a.level]; })
    );
    var injuryRows = [['Zone','Début','Fin','Durée (j)','Note']].concat(
      injuries.slice().sort(function(a,b){ return a.startDate.localeCompare(b.startDate); })
        .map(function(i){ return [i.zone, i.startDate, i.endDate||'(en cours)', injuryDuration(i), i.note||'']; })
    );
    var gainageRows = [['Date']].concat(
      gainage.slice().sort(function(a,b){ return a.date.localeCompare(b.date); }).map(function(g){ return [g.date]; })
    );
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sportRows), 'Sport');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(alcoholRows), 'Alcool');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(gainageRows), 'Gainage');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(injuryRows), 'Blessures');
    var wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    var blob = new Blob([wbout], {type:'application/octet-stream'});
    try{
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'suivi-forme.xlsx';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      toast('Export lancé');
    }catch(e){
      toast('Export impossible');
    }
  }


  // ---- import (restores an Excel export made by exportExcel) ----
  async function importExcel(file){
    if(typeof XLSX === 'undefined'){ toast('Import indisponible'); return; }
    try{
      var buf = await file.arrayBuffer();
      var wb = XLSX.read(buf, {type:'array'});
      var rows = function(name){
        var ws = wb.Sheets[name];
        return ws ? XLSX.utils.sheet_to_json(ws, {header:1, raw:false}).slice(1) : [];
      };
      var catByLabel = {}; CATEGORIES.forEach(function(c){ catByLabel[c.label]=c.key; });
      var alcByLabel = {}; ALCOHOL_LEVELS.forEach(function(a){ alcByLabel[a.label]=a.key; });
      var now = new Date().toISOString();
      var ops = [], counters = {};
      rows('Sport').forEach(function(r){
        if(!r[0]) return;
        var cat = catByLabel[r[1]] || r[1];
        var k = r[0]+'|'+cat; counters[k] = (counters[k]||0)+1;
        ops.push({type:'add', collection:'sessions', localId:'imp-'+r[0]+'-'+cat+'-'+counters[k], data:{date:r[0], category:cat, note:r[2]||'', createdAt:now}});
      });
      rows('Alcool').forEach(function(r){
        if(!r[0]) return;
        ops.push({type:'set', collection:'alcohol', docId:r[0], data:{date:r[0], level:alcByLabel[r[1]]||r[1], createdAt:now}});
      });
      rows('Gainage').forEach(function(r){
        if(!r[0]) return;
        ops.push({type:'set', collection:'gainage', docId:r[0], data:{date:r[0], createdAt:now}});
      });
      rows('Blessures').forEach(function(r){
        if(!r[0] || !r[1]) return;
        var data = {zone:r[0], startDate:r[1], note:r[4]||'', createdAt:now};
        if(r[2] && r[2]!=='(en cours)') data.endDate = r[2];
        ops.push({type:'add', collection:'injuries', localId:'imp-inj-'+r[1]+'-'+String(r[0]).toLowerCase().replace(/[^a-z0-9]+/g,'-'), data:data});
      });
      if(!ops.length){ toast('Aucune donnée trouvée dans ce fichier'); return; }
      var done = 0;
      for(var i=0;i<ops.length;i++){
        await performOp(ops[i]);
        done++;
        if(done%10===0) toast('Import… '+done+'/'+ops.length);
      }
      logEvent('import: '+done+' éléments envoyés');
      await loadAll();
      toast('Import terminé : '+done+' éléments');
    }catch(e){
      logEvent('import ÉCHEC: '+e.message);
      toast('Import échoué : '+e.message);
    }
  }

  function yearCell(d, year){
    if(d.getFullYear()!==year) return '<span class="year-cell empty-cell"></span>';
    var ds = fmt(d);
    var count = sessionsOn(ds).length;
    var level = Math.min(count,3);
    var alc = alcoholOn(ds);
    var hasInjury = injuriesOn(ds).length>0;
    var isToday = isSameDay(d, new Date());
    return '<button class="year-cell'+(isToday?' today':'')+(hasInjury?' injured':'')+'" style="background:var(--heat-'+level+')" data-action="goto-day" data-date="'+ds+'" title="'+ds+' · '+count+' séance(s)">'
      + (alc ? '<i class="year-alc" style="background:'+ALC_MAP[alc.level].color+'"></i>' : '')
    + '</button>';
  }

  function viewYear(){
    var year = yearCursor;
    var jan1 = new Date(year,0,1);
    var start = startOfWeek(jan1);
    var dec31 = new Date(year,11,31);
    var end = addDays(startOfWeek(dec31),6);
    var totalDays = Math.round((end-start)/86400000)+1;
    var weeks = Math.ceil(totalDays/7);
    var cols = [];
    for(var w=0; w<weeks; w++){
      var col = [];
      for(var d=0; d<7; d++) col.push(addDays(start, w*7+d));
      cols.push(col);
    }
    var monthTicks = [];
    var lastMonth = -1;
    cols.forEach(function(col,i){
      var firstInYear = col.filter(function(dd){ return dd.getFullYear()===year; })[0];
      if(firstInYear && firstInYear.getMonth()!==lastMonth){
        monthTicks.push({i:i, label:MONTHS_SHORT[firstInYear.getMonth()]});
        lastMonth = firstInYear.getMonth();
      }
    });
    var monthsRow = [];
    for(var i=0;i<weeks;i++){
      var tick = monthTicks.filter(function(t){ return t.i===i; })[0];
      monthsRow.push('<span>'+(tick?tick.label:'')+'</span>');
    }
    return '<section class="year-view">'
      + '<div class="day-nav">'
        + '<button class="nav-btn" data-action="year-prev" aria-label="Année précédente">‹</button>'
        + '<div class="day-label"><div class="day-date">'+year+'</div></div>'
        + '<button class="nav-btn" data-action="year-next" aria-label="Année suivante">›</button>'
      + '</div>'
      + '<div class="year-scroll">'
        + '<div class="year-months">'+monthsRow.join('')+'</div>'
        + '<div class="year-heatmap">'+cols.map(function(col){ return col.map(function(dd){ return yearCell(dd,year); }).join(''); }).join('')+'</div>'
      + '</div>'
      + '<div class="year-legend">'
        + '<span>Moins</span><i style="background:var(--heat-0)"></i><i style="background:var(--heat-1)"></i><i style="background:var(--heat-2)"></i><i style="background:var(--heat-3)"></i><span>Plus</span>'
        + '<span class="legend-alc"><i></i> Alcool</span>'
        + '<span class="legend-injury"><i></i> Blessure</span>'
      + '</div>'
    + '</section>';
  }

  function barRow(label, count, total, color){
    var pct = total ? Math.round(count/total*100) : 0;
    return '<li class="bar-row">'
      + '<span class="bar-label">'+label+'</span>'
      + '<span class="bar-track"><span class="bar-fill" style="width:'+pct+'%;background:'+color+'"></span></span>'
      + '<span class="bar-count">'+count+'</span>'
    + '</li>';
  }

  function deltaTag(cur, prev){
    var diff = cur - prev;
    if(diff===0) return '<span class="delta">= vs période préc.</span>';
    return '<span class="delta">'+(diff>0?'+':'')+diff+' vs période préc.</span>';
  }

  function viewStats(){
    var fromDs = statsFrom, toDs = statsTo;
    var rangeSessions = sessions.filter(function(s){ return s.date>=fromDs && s.date<=toDs; });
    var rangeAlcohol = alcohol.filter(function(a){ return a.date>=fromDs && a.date<=toDs; });
    var days = daysBetweenInclusive(fromDs, toDs);

    var prevTo = addDays(parseISO(fromDs), -1);
    var prevFrom = addDays(prevTo, -(days-1));
    var prevFromDs = fmt(prevFrom), prevToDs = fmt(prevTo);
    var prevSessions = sessions.filter(function(s){ return s.date>=prevFromDs && s.date<=prevToDs; });
    var prevAlcohol = alcohol.filter(function(a){ return a.date>=prevFromDs && a.date<=prevToDs; });

    var byCat = CATEGORIES.map(function(c){
      return {label:c.label, color:c.color, count: rangeSessions.filter(function(s){ return s.category===c.key; }).length};
    });
    var totalSessions = rangeSessions.length;
    var activeDaysSet = {};
    rangeSessions.forEach(function(s){ activeDaysSet[s.date]=true; });
    var activeDays = Object.keys(activeDaysSet).length;

    var byLevel = ALCOHOL_LEVELS.map(function(l){
      return {label:l.label, color:l.color, count: rangeAlcohol.filter(function(a){ return a.level===l.key; }).length};
    });
    var alcDays = rangeAlcohol.length;

    var days12wSport = [];
    for(var si=83;si>=0;si--) days12wSport.push(addDays(new Date(), -si));

    return '<section class="stats-view">'
      + '<div class="card filter-card">'
        + '<div class="filter-row">'
          + '<label>Du <input type="date" id="stats-from" value="'+fromDs+'"></label>'
          + '<label>Au <input type="date" id="stats-to" value="'+toDs+'"></label>'
        + '</div>'
        + '<div class="filter-presets">'
          + [7,30,90,365].map(function(n){
              return '<button class="'+(activePreset===n?'active':'')+'" data-action="stats-preset" data-days="'+n+'">'+(n===365?'1 an':n+'j')+'</button>';
            }).join('')
        + '</div>'
      + '</div>'
      + '<div class="tiles">'
        + '<div class="tile"><span class="tile-num">'+totalSessions+'</span><span class="tile-label">Séances ('+deltaTag(totalSessions, prevSessions.length).replace('<span class="delta">','').replace('</span>','')+')</span></div>'
        + '<div class="tile"><span class="tile-num">'+activeDays+'</span><span class="tile-label">Jours actifs sur '+days+'</span></div>'
      + '</div>'
      + '<div class="card-row">'
        + '<div class="card">'
          + '<div class="card-head"><h2>Sport — 12 sem.</h2></div>'
          + '<div class="year-scroll"><div class="gainage-heatmap">'+days12wSport.map(function(d){
              var dds = fmt(d);
              var done = sessionsOn(dds).length>0;
              var isToday = isSameDay(d, new Date());
              return '<button class="year-cell'+(isToday?' today':'')+'" style="background:'+(done?'var(--accent)':'var(--heat-0)')+'" data-action="goto-day" data-date="'+dds+'" title="'+dds+(done?' · sport':' · repos')+'"></button>';
            }).join('')+'</div></div>'
        + '</div>'
        + '<div class="card">'
          + '<div class="card-head"><h2>Alcool — 12 sem.</h2></div>'
          + '<div class="year-scroll"><div class="gainage-heatmap">'+days12wSport.map(function(d){
              var dds = fmt(d);
              var a = alcoholOn(dds);
              var isToday = isSameDay(d, new Date());
              return '<button class="year-cell'+(isToday?' today':'')+'" style="background:'+(a?ALC_MAP[a.level].color:'var(--heat-0)')+'" data-action="goto-day" data-date="'+dds+'" title="'+dds+(a?' · '+ALC_MAP[a.level].label:' · aucun')+'"></button>';
            }).join('')+'</div></div>'
        + '</div>'
      + '</div>'
      + '<div class="card">'
        + '<h2>Répartition sport</h2>'
        + '<ul class="bar-list">'+byCat.map(function(c){ return barRow(c.label, c.count, totalSessions, c.color); }).join('')+'</ul>'
      + '</div>'
      + '<div class="card">'
        + '<h2>Alcool</h2>'
        + '<p class="stat-line">'+alcDays+' jour(s) sur '+days+' — '+deltaTag(alcDays, prevAlcohol.length)+'</p>'
        + '<ul class="bar-list">'+byLevel.map(function(l){ return barRow(l.label, l.count, Math.max(alcDays,1), l.color); }).join('')+'</ul>'
      + '</div>'
      + '<button class="btn-primary btn-block" data-action="export-excel">Exporter toutes les données (.xlsx)</button>'
      + '<button class="btn-secondary btn-block" data-action="import-excel">Importer un export (.xlsx)</button>'
      + '<input type="file" id="import-file" accept=".xlsx" hidden>'
    + '</section>';
  }

  function viewHistory(){
    var items = sessions.filter(function(s){ return s.category===historyCategory; })
      .slice()
      .sort(function(a,b){ return b.date.localeCompare(a.date) || (b.createdAt||'').localeCompare(a.createdAt||''); });
    var meta = CAT_MAP[historyCategory];

    var today = fmt(new Date());
    var last30Cut = fmt(addDays(new Date(), -29));
    var last30 = items.filter(function(s){ return s.date>=last30Cut; }).length;
    var lastDate = items.length ? items[0].date : null;
    var firstDate = items.length ? items[items.length-1].date : null;
    var daysSinceLast = lastDate ? daysBetweenInclusive(lastDate, today)-1 : null;

    var kpiHtml = items.length ? (
      '<div class="tiles">'
        + '<div class="tile"><span class="tile-num">'+items.length+'</span><span class="tile-label">Total séances</span></div>'
        + '<div class="tile"><span class="tile-num">'+last30+'</span><span class="tile-label">30 derniers jours</span></div>'
        + '<div class="tile"><span class="tile-num">'+(daysSinceLast===0?'Auj.':daysSinceLast+'j')+'</span><span class="tile-label">Depuis la dernière</span></div>'
        + '<div class="tile"><span class="tile-num" style="font-size:15px;">'+fmtShort(parseISO(firstDate))+'</span><span class="tile-label">Première séance</span></div>'
      + '</div>'
    ) : '';

    return '<section class="history-view">'
      + '<div class="cat-tabs">'
        + CATEGORIES.map(function(c){
            return '<button class="cat-tab'+(c.key===historyCategory?' active':'')+'" style="--chip:'+c.color+'" data-action="pick-history-cat" data-cat="'+c.key+'">'+c.label+'</button>';
          }).join('')
      + '</div>'
      + kpiHtml
      + '<div class="card">'
        + '<div class="history-summary"><span class="dot" style="background:'+meta.color+'"></span>'+items.length+' séance(s)</div>'
        + '<ul class="history-list">'+(items.length ? items.map(function(s){ return editingSessionId===s.id ? '<li class="edit-row">'+editSessionForm(s)+'</li>' : historyItem(s); }).join('') : '<p class="empty">Pas encore de séance dans cette catégorie.</p>')+'</ul>'
      + '</div>'
    + '</section>';
  }

  function addInjuryForm(){
    return '<div class="card form-card">'
      + '<input type="text" id="injury-zone" placeholder="Zone (ex: Genou droit)" value="'+escapeHtml(injuryZone)+'" maxlength="60">'
      + '<div class="filter-row">'
        + '<label>Début <input type="date" id="injury-start" value="'+injuryStart+'"></label>'
        + '<label>Fin (si guérie) <input type="date" id="injury-end" value="'+injuryEnd+'"></label>'
      + '</div>'
      + '<textarea id="injury-note" placeholder="Note (optionnel)" maxlength="200">'+escapeHtml(injuryNote)+'</textarea>'
      + '<div class="form-actions">'
        + '<button class="btn-secondary" data-action="cancel-add-injury">Annuler</button>'
        + '<button class="btn-primary" data-action="save-injury"'+((injuryZone.trim()&&injuryStart)?'':' disabled')+'>Enregistrer</button>'
      + '</div>'
    + '</div>';
  }

  function editInjuryForm(i){
    return '<div class="card form-card">'
      + '<input type="text" id="edit-injury-zone" placeholder="Zone" value="'+escapeHtml(editInjuryZone)+'" maxlength="60">'
      + '<div class="filter-row">'
        + '<label>Début <input type="date" id="edit-injury-start" value="'+editInjuryStart+'"></label>'
        + '<label>Fin (si guérie) <input type="date" id="edit-injury-end" value="'+editInjuryEnd+'"></label>'
      + '</div>'
      + '<textarea id="edit-injury-note" placeholder="Note (optionnel)" maxlength="200">'+escapeHtml(editInjuryNote)+'</textarea>'
      + '<div class="form-actions">'
        + '<button class="btn-secondary" data-action="cancel-edit-injury">Annuler</button>'
        + '<button class="btn-primary" data-action="save-edit-injury" data-id="'+i.id+'"'+((editInjuryZone.trim()&&editInjuryStart)?'':' disabled')+'>Enregistrer</button>'
      + '</div>'
    + '</div>';
  }

  function viewInjuries(){
    var sorted = injuries.slice().sort(function(a,b){ return b.startDate.localeCompare(a.startDate); });
    var ongoingCount = sorted.filter(function(i){ return !i.endDate; }).length;
    return '<section class="injuries-view">'
      + (sorted.length ? ('<div class="tiles">'
          + '<div class="tile"><span class="tile-num">'+sorted.length+'</span><span class="tile-label">Blessures enregistrées</span></div>'
          + '<div class="tile"><span class="tile-num">'+ongoingCount+'</span><span class="tile-label">En cours</span></div>'
        + '</div>') : '')
      + '<div class="card">'
        + '<div class="card-head"><h2>Blessures</h2>'+(injuryFormOpen?'':'<button class="btn-add" data-action="open-add-injury">+ Blessure</button>')+'</div>'
        + (sorted.length ? '<ul class="injury-list">'+sorted.map(function(i){ return editingInjuryId===i.id ? '<li class="edit-row">'+editInjuryForm(i)+'</li>' : injuryItem(i); }).join('')+'</ul>' : '<p class="empty">Aucune blessure enregistrée.</p>')
      + '</div>'
      + (injuryFormOpen ? addInjuryForm() : '')
    + '</section>';
  }

  function viewGainage(){
    var ds = fmt(dayCursor);
    var streak = computeGainageStreak();
    var pct7 = gainagePct(7);
    var pct30 = gainagePct(30);
    var pct90 = gainagePct(90);
    var days12w = [];
    for(var i=83;i>=0;i--) days12w.push(addDays(new Date(), -i));

    return '<section class="gainage-view">'
      + '<div class="tiles">'
        + '<div class="tile"><span class="tile-num">'+streak+'</span><span class="tile-label">Jours d’affilée</span></div>'
        + '<div class="tile"><span class="tile-num">'+(pct7===null?'–':pct7+'%')+'</span><span class="tile-label">7 derniers jours</span></div>'
        + '<div class="tile"><span class="tile-num">'+(pct30===null?'–':pct30+'%')+'</span><span class="tile-label">30 derniers jours</span></div>'
        + '<div class="tile"><span class="tile-num">'+(pct90===null?'–':pct90+'%')+'</span><span class="tile-label">90 derniers jours</span></div>'
      + '</div>'
      + '<div class="card">'
        + '<div class="card-head"><h2>12 dernières semaines</h2></div>'
        + '<div class="year-scroll"><div class="gainage-heatmap">'+days12w.map(function(d){
            var dds = fmt(d);
            var done = gainageOn(dds);
            var isToday = isSameDay(d, new Date());
            return '<button class="year-cell'+(isToday?' today':'')+'" style="background:'+(done?'var(--c-gainage)':'var(--heat-0)')+'" data-action="goto-day" data-date="'+dds+'" title="'+dds+(done?' · fait':' · pas fait')+'"></button>';
          }).join('')+'</div></div>'
      + '</div>'
      + '<div class="card">'
        + '<div class="card-head"><h2>Aujourd’hui</h2></div>'
        + '<button class="gainage-toggle'+(gainageOn(ds)?' active':'')+'" data-action="toggle-gainage" data-date="'+ds+'">'+(gainageOn(ds)?'✓ Fait':'Marquer comme fait')+'</button>'
      + '</div>'
    + '</section>';
  }

  function viewHtmlFor(view){
    switch(view){
      case 'day': return viewDay();
      case 'week': return viewWeek();
      case 'month': return viewMonth();
      case 'year': return viewYear();
      case 'stats': return viewStats();
      case 'history': return viewHistory();
      case 'gainage': return viewGainage();
      case 'injuries': return viewInjuries();
      default: return '';
    }
  }

  function render(){
    document.getElementById('topbar').innerHTML = topbarHtml();
    document.querySelectorAll('#tabbar button').forEach(function(b){
      b.classList.toggle('active', b.dataset.view===currentView);
    });
    document.getElementById('content').innerHTML = bannerHtml() + viewHtmlFor(currentView);
  }

  // ---- events ----
  document.getElementById('topbar').addEventListener('click', function(e){
    var syncBtn = e.target.closest('[data-action="retry-sync"]');
    if(syncBtn){
      syncBtn.classList.add('spinning');
      startSync().then(function(msg){ toast(msg || 'Données actualisées'); }).catch(function(){});
      return;
    }
    var debugBtn = e.target.closest('[data-action="toggle-debug"]');
    if(debugBtn){ toggleDebugPanel(); return; }
  });

  document.addEventListener('change', function(e){
    if(e.target && e.target.id==='import-file' && e.target.files && e.target.files[0]){ importExcel(e.target.files[0]); e.target.value=''; }
  });

  document.addEventListener('click', function(e){
    var clearBtn = e.target.closest('[data-action="clear-debug"]');
    if(clearBtn){ debugLog = []; saveDebugLog(); renderDebugPanel(); return; }
    var closeBtn = e.target.closest('[data-action="close-debug"]');
    if(closeBtn){ toggleDebugPanel(); return; }
  });

  document.getElementById('tabbar').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-view]');
    if(!btn) return;
    currentView = btn.dataset.view;
    addSessionFormOpen = false;
    selectedCategory = null;
    draftNote = '';
    editingSessionId = null;
    injuryFormOpen = false;
    editingInjuryId = null;
    render();
  });

  document.getElementById('content').addEventListener('click', function(e){
    var btn = e.target.closest('[data-action]');
    if(!btn) return;
    var action = btn.dataset.action;
    switch(action){
      case 'day-prev': dayCursor = addDays(dayCursor,-1); addSessionFormOpen=false; editingSessionId=null; render(); break;
      case 'day-next': dayCursor = addDays(dayCursor,1); addSessionFormOpen=false; editingSessionId=null; render(); break;
      case 'day-today': dayCursor = new Date(); addSessionFormOpen=false; editingSessionId=null; render(); break;
      case 'week-prev': weekCursor = addDays(weekCursor,-7); render(); break;
      case 'week-next': weekCursor = addDays(weekCursor,7); render(); break;
      case 'month-prev': monthCursor = new Date(monthCursor.getFullYear(), monthCursor.getMonth()-1, 1); render(); break;
      case 'month-next': monthCursor = new Date(monthCursor.getFullYear(), monthCursor.getMonth()+1, 1); render(); break;
      case 'year-prev': yearCursor -= 1; render(); break;
      case 'year-next': yearCursor += 1; render(); break;
      case 'goto-day': dayCursor = parseISO(btn.dataset.date); currentView='day'; addSessionFormOpen=false; editingSessionId=null; render(); break;
      case 'open-add-session': addSessionFormOpen=true; selectedCategory=null; draftNote=''; editingSessionId=null; render(); break;
      case 'cancel-add-session': addSessionFormOpen=false; render(); break;
      case 'pick-category': selectedCategory = btn.dataset.cat; render(); break;
      case 'save-session':
        if(!selectedCategory) return;
        addSession(selectedCategory, draftNote, btn.dataset.date);
        addSessionFormOpen=false; selectedCategory=null; draftNote='';
        render();
        break;
      case 'delete-session':
        if(editingSessionId===btn.dataset.id) editingSessionId=null;
        deleteSession(btn.dataset.id);
        break;
      case 'start-edit-session': {
        var editing = sessions.filter(function(x){ return x.id===btn.dataset.id; })[0];
        if(!editing) return;
        editingSessionId = editing.id;
        editCategory = editing.category;
        editNote = editing.note || '';
        editDate = editing.date;
        addSessionFormOpen = false;
        render();
        break;
      }
      case 'cancel-edit-session': editingSessionId=null; render(); break;
      case 'pick-edit-category': editCategory = btn.dataset.cat; render(); break;
      case 'save-edit-session':
        if(!editCategory || !editDate) return;
        updateSession(btn.dataset.id, editCategory, editNote, editDate);
        editingSessionId=null; editCategory=null; editNote=''; editDate='';
        render();
        break;
      case 'set-alcohol': {
        var date = btn.dataset.date, level = btn.dataset.level;
        var existing = alcoholOn(date);
        if(existing && existing.level===level){ clearAlcohol(date); } else { setAlcohol(date, level); }
        render();
        break;
      }
      case 'clear-alcohol': clearAlcohol(btn.dataset.date); render(); break;
      case 'toggle-gainage': toggleGainage(btn.dataset.date); break;
      case 'stats-preset': {
        var n = parseInt(btn.dataset.days,10);
        activePreset = n;
        statsTo = fmt(new Date());
        statsFrom = fmt(addDays(new Date(), -(n-1)));
        render();
        break;
      }
      case 'pick-history-cat': historyCategory = btn.dataset.cat; render(); break;
      case 'export-excel': exportExcel(); break;
      case 'import-excel': { var f=document.getElementById('import-file'); if(f) f.click(); break; }
      case 'retry-sync':
        btn.classList.add('spinning');
        startSync().then(function(msg){ toast(msg || 'Données actualisées'); }).catch(function(){});
        break;
      case 'open-add-injury':
        injuryFormOpen=true; injuryZone=''; injuryStart=fmt(new Date()); injuryEnd=''; injuryNote='';
        editingInjuryId=null;
        render();
        break;
      case 'cancel-add-injury': injuryFormOpen=false; render(); break;
      case 'save-injury':
        if(!injuryZone.trim() || !injuryStart) return;
        addInjury(injuryZone.trim(), injuryStart, injuryEnd||null, injuryNote);
        injuryFormOpen=false; injuryZone=''; injuryStart=''; injuryEnd=''; injuryNote='';
        render();
        break;
      case 'start-edit-injury': {
        var inj = injuries.filter(function(x){ return x.id===btn.dataset.id; })[0];
        if(!inj) return;
        editingInjuryId = inj.id;
        editInjuryZone = inj.zone;
        editInjuryStart = inj.startDate;
        editInjuryEnd = inj.endDate || '';
        editInjuryNote = inj.note || '';
        injuryFormOpen = false;
        render();
        break;
      }
      case 'cancel-edit-injury': editingInjuryId=null; render(); break;
      case 'save-edit-injury':
        if(!editInjuryZone.trim() || !editInjuryStart) return;
        updateInjury(btn.dataset.id, editInjuryZone.trim(), editInjuryStart, editInjuryEnd||null, editInjuryNote);
        editingInjuryId=null; render();
        break;
      case 'resolve-injury': resolveInjuryToday(btn.dataset.id); break;
      case 'delete-injury':
        if(editingInjuryId===btn.dataset.id) editingInjuryId=null;
        deleteInjury(btn.dataset.id);
        break;
    }
  });

  document.getElementById('content').addEventListener('input', function(e){
    if(e.target.id==='session-note'){ draftNote = e.target.value; }
    if(e.target.id==='edit-note'){ editNote = e.target.value; }
    if(e.target.id==='injury-zone'){ injuryZone = e.target.value; }
    if(e.target.id==='injury-note'){ injuryNote = e.target.value; }
    if(e.target.id==='edit-injury-zone'){ editInjuryZone = e.target.value; }
    if(e.target.id==='edit-injury-note'){ editInjuryNote = e.target.value; }
  });
  document.getElementById('content').addEventListener('change', function(e){
    if(e.target.id==='stats-from'){ statsFrom = e.target.value; activePreset=null; render(); }
    if(e.target.id==='stats-to'){ statsTo = e.target.value; activePreset=null; render(); }
    if(e.target.id==='edit-date'){ editDate = e.target.value; render(); }
    if(e.target.id==='injury-start'){ injuryStart = e.target.value; render(); }
    if(e.target.id==='injury-end'){ injuryEnd = e.target.value; render(); }
    if(e.target.id==='edit-injury-start'){ editInjuryStart = e.target.value; render(); }
    if(e.target.id==='edit-injury-end'){ editInjuryEnd = e.target.value; render(); }
  });

  // ---- boot ----
  loadPendingOps();
  loadLocalFallback();
  render();

  var TERMINAL_CODES = ['not_granted','capability_disabled','capability_removed','revoked'];
  var MAX_RETRIES = 4;

  function sleep(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }

  async function fetchSessions(){
    var docs = await fsGetCollection('sessions');
    docs.sort(function(a,b){ return b.date.localeCompare(a.date); });
    sessions = docs;
    logEvent('fetchSessions: '+docs.length+' docs (REST, lecture directe serveur)');
  }
  async function fetchAlcohol(){
    var docs = await fsGetCollection('alcohol');
    docs.sort(function(a,b){ return b.date.localeCompare(a.date); });
    alcohol = docs;
  }
  async function fetchInjuries(){
    var docs = await fsGetCollection('injuries');
    docs.sort(function(a,b){ return b.startDate.localeCompare(a.startDate); });
    injuries = docs;
  }
  async function fetchGainage(){
    var docs = await fsGetCollection('gainage');
    docs.sort(function(a,b){ return b.date.localeCompare(a.date); });
    gainage = docs;
  }

  // Loads data with a one-time fetch (not a live subscription) — more reliable
  // across browser contexts than a persistent realtime channel. Retries with
  // backoff on transient errors; only shows the offline banner if it still
  // fails after that, and never on a terminal/definitive refusal.
  async function loadAll(){
    var attempt = 0;
    while(true){
      try{
        await Promise.all([fetchSessions(), fetchAlcohol(), fetchInjuries(), fetchGainage()]);
        dbUnavailable = false;
        saveLocalFallback();
        render();
        logEvent('loadAll: réussi via REST (pas de repli local)');
        return;
      }catch(err){
        console.error('db load error', err);
        var code = err && err.code;
        logEvent('loadAll: échec tentative '+attempt+', code='+code+', msg='+(err&&err.message));
        if(TERMINAL_CODES.indexOf(code) !== -1 || attempt >= MAX_RETRIES){
          dbUnavailable = true;
          loadLocalFallback();
          render();
          logEvent('loadAll: ABANDON -> repli sur localStorage (dbUnavailable=true), sessions locales='+sessions.length);
          return;
        }
        attempt++;
        await sleep(Math.min(800 * Math.pow(2, attempt), 8000));
      }
    }
  }

  async function startSync(){
    logEvent('startSync démarré (REST)');
    await flushPendingOps();
    await loadAll();
    logEvent('startSync: loadAll terminé, sessions en mémoire='+sessions.length+', dbUnavailable='+dbUnavailable);
    if(dbUnavailable){
      return 'Hors ligne';
    }
    return 'Données actualisées';
  }

  startSync();

  // Re-sync automatically whenever this page becomes the visible/active one
  // again — switching back from another app or tab, not just a full reload.
  // Throttled so rapid switching doesn't fire it repeatedly.
  var lastAutoSync = Date.now();
  var AUTO_SYNC_MIN_GAP_MS = 8000;
  function maybeAutoSync(){
    if(Date.now() - lastAutoSync < AUTO_SYNC_MIN_GAP_MS) return;
    lastAutoSync = Date.now();
    startSync();
  }
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') maybeAutoSync();
  });
  window.addEventListener('pageshow', function(){ maybeAutoSync(); });
  window.addEventListener('focus', function(){ maybeAutoSync(); });
  // Fallback: the events above don't reliably fire inside every host app's
  // in-app view (e.g. navigating within the Claude app may not trigger a
  // real browser visibility/focus change). A periodic poll guarantees
  // freshness regardless. A quick extra sync shortly after opening catches
  // anything the very first load missed, then it settles into the interval.
  setTimeout(function(){ lastAutoSync = Date.now(); startSync(); }, 1000);
  setInterval(maybeAutoSync, 20000);
})();
</script>

</body></html>
